app:
  name: Barology
  repository_name: Crowned
  ranking_system: The Crown
  intelligence_engine: Barology
  category: AI-powered hip-hop intelligence network
  status: PRODUCT_DEFINED_PRE_DESIGN
  initial_runtime: Base44

thesis:
  user_promise:
    - stay current on hip-hop and selected AI news
    - understand songs and bars through evidence-backed AI analysis
    - inspect The Crown rankings of lyricists, albums, songs, verses, and bars
    - build personal reputation by contributing, challenging, and catching AI misses
  moat:
    - validated human-vs-AI interpretation corpus
    - provenance-rich rap knowledge graph
    - Barology eval/failure taxonomy
    - contributor expertise/reputation graph
    - news-to-corpus feedback loop

core_loop:
  - discover_artist_or_song
  - open_song
  - read_lyrics
  - swipe_to_barology
  - inspect_interpretation_and_evidence
  - talk_to_song_or_add_missing_meaning
  - support_or_challenge_interpretation
  - gauntlet_adjudicates
  - canonical_state_updates
  - contributor_profile_updates
  - rankings_and_corpus_update

onboarding:
  visual_reference: Wispr-style minimal one-decision-per-screen flow
  visual_mode: white_or_warm_white
  screens:
    - Splash
    - Sign_In
    - Create_Profile
    - Pick_Artists
    - Pick_Eras
    - Lyricism_Preferences
    - How_Barology_Works
    - First_Bar_Challenge
  sign_in:
    providers:
      - Google
      - Apple
      - Email
  copy:
    pick_artists: Who do you listen to most?
    pick_eras: Which eras of hip-hop do you appreciate most?
    lyricism_preferences: What do you appreciate most about lyricism?
    walkthrough_1: See what Barology found.
    walkthrough_2: Swipe for the breakdown.
    walkthrough_3: Think there's more to it? Say it.
    first_challenge: What do you see?
    challenge_success: You caught something.
  copy_avoid:
    - What's your ear tuned for?
    - What eras know your ear?
    - Teach the central interaction.
    - Configure your expertise.
  preference_rule: onboarding selections seed recommendations only; earned expertise comes from validated behavior
  canonical_spec: product/ONBOARDING.md

navigation:
  global:
    bottom_nav:
      - Home
      - Discover
      - Crown
      - News
      - Profile
    command_drawer:
      style: near-black sliding panel with underlying screen still partially visible
      destinations:
        - Home
        - Barology
        - Rankings
        - Activity
        - News
        - Artists
        - Albums
        - Songs
        - Discover
        - Profile
  section_tabs:
    Barology: [Recent, Trending, Top Scores, AI Misses, Disputed]
    Rankings: [Artists, Songs, Albums, Verses, Bars]
    News: [Today, Hip-Hop, Releases, Industry, Culture, AI]
    Activity: [All, Breakdowns, Catches, Challenges, Rank Moves, Community]
  gestures:
    vertical: scroll_content
    horizontal_carousels: browse_collections
    song_fullscreen_horizontal: Lyrics_to_Barology
    edge_swipe: command_drawer

visual:
  brand:
    primary_canvas: near-black
    accent: Crown gold
    outer_surfaces: cinematic_photographic_cultural
    inner_barology_surfaces: analytical_evidence_first
  human_profile:
    background: white_or_warm_white
    typography: dark
  artist_profile:
    background: near-black
    typography: light
  semantic_highlighting:
    rule: color communicates validated analytical depth, not decoration
    crown_treatment: exceptional_verified_construction
  splash:
    title: BAROLOGY
    ai_line: AI-Powered Hip-Hop Intelligence
    header: Hip-hop, decoded.
    quote: Follow the latest news. Break down every bar. Rank the greatest lyricists. Build your reputation by catching what AI misses.
    entry: Get Started
    secondary_entry: Swipe to enter
    background: looping dim cinematic performance/stadium video with seamless crossfade loop

barology:
  analysis_unit: overlapping lyric spans
  preserve_uncertainty: true
  statuses:
    - CONFIRMED
    - STRONG
    - PLAUSIBLE
    - DISPUTED
    - REJECTED
    - UNRESOLVED
  dimensions:
    - literal_semantics
    - phonetics
    - homophones
    - syllable_segmentation
    - rhyme_engineering
    - wordplay
    - entendres
    - metaphor_and_idiom
    - multi_bar_schemes
    - backward_context
    - forward_context
    - artist_catalog
    - hip_hop_history
    - culture
    - historical_events
    - current_events
    - narrative_structure
    - evidence_and_intent_signals
  truth_rules:
    - never maximize entendre count for spectacle
    - independent blind analysis before comparison to canonical interpretation
    - critic cannot be the proposing agent
    - preserve rejected interpretations and revision history
    - every validated AI miss becomes an eval case
    - scores must be decomposable and versioned

song_chat:
  name: Talk to This Song
  scope: song_specific_persistent_AI_conversation
  behavior:
    - user_can_highlight_exact_span
    - user_can_propose_interpretation_in_chat
    - Barology_tests_hypothesis_with_scoped_mini_gauntlet
    - accepted_interpretation_updates_song_breakdown
    - contributor_receives_profile_credit
  context:
    - current_song
    - current_span
    - existing_interpretations
    - artist_catalog
    - corpus_context
    - evidence

community:
  profile_currency:
    - catches
    - AI_misses
    - first_finds
    - confirmed_contributions
    - challenges
    - successful_challenges
    - doubts
    - artist_expertise
    - technique_expertise
    - validation_rate
  voting:
    support: true
    oppose: true
    structured_reasons:
      - OVERREACH
      - WRONG_REFERENCE
      - WRONG_TRANSCRIPTION
      - PHONETICALLY_UNSUPPORTED
      - CONTEXT_UNSUPPORTED
      - INCOMPLETE
      - STRONGER_ALTERNATIVE
      - EVIDENCE_PROBLEM
    periodic_re_adjudication: true

news:
  purpose:
    - daily_retention
    - monetizable_media_inventory
    - current_culture_observation
    - corpus_expansion
  verticals:
    - Hip-Hop
    - Releases
    - Industry
    - Culture
    - AI
  corpus_rule: relevant entities/events/relationships feed the knowledge layer with provenance

ranking:
  public_name: The Crown
  entities: [Artist, Album, Song, Verse, Bar]
  exclude_from_core_lyric_score:
    - streaming_popularity
    - sales
    - beat_quality
    - celebrity
  initial_components:
    - lyrical_density
    - wordplay
    - rhyme_engineering
    - layering
    - cohesion
    - originality
    - reference_depth
    - extended_scheme_quality
    - narrative_quality
    - consistency

mvp:
  must_build:
    - Splash
    - Sign_In
    - Create_Profile
    - Pick_Artists
    - Pick_Eras
    - Lyricism_Preferences
    - How_Barology_Works
    - First_Bar_Challenge
    - Home
    - Discover
    - Activity
    - News
    - Crown_Rankings
    - Artist_Profile
    - Album_Profile
    - Song_Lyrics
    - Song_Barology
    - Talk_To_This_Song
    - Human_Profile
    - Top_Breakdowns
    - user_auth
    - contributions
    - structured_voting
    - gauntlet_adjudication
    - activity_events
  integrations_now:
    - Base44
    - James_Watson_Gauntlet_Loop_adaptation
    - last30days_pattern_or_service
    - Firecrawl
  provider_readiness:
    contract: implementation/API-AND-SECRETS.md
    zero_optional_keys_required_for_seeded_build: true
    server_side_secrets_only: true
    missing_provider_state: UNCONFIGURED
    client_direct_provider_calls: false
  defer_until_measured_need:
    - GraphRAG
    - Promptfoo_runtime_dependency
    - pgContext
    - pgGraph
    - Mem0
    - Open_Notebook_Corpus_Studio
    - Base44_to_Supabase_migration

acceptance_tests:
  - first_run_user_can_sign_in_with_supported_provider_and_complete_onboarding_without_dense_copy
  - onboarding_copy_uses_plain_natural_language_and_never_uses_banned_ear_or_technical_phrasing
  - user_can_navigate_artist_to_album_to_song_without_searching_again
  - song_preserves_vertical_reading_and_fullscreen_Lyrics_Barology_swipe
  - Barology_annotations_attach_to_exact_spans_not_only_lines
  - user_can_talk_to_a_song_and_propose_a_meaning_conversationally
  - human_can_submit_missing_interpretation_or_structured_challenge
  - adjudication_result_changes_canonical_status_without_erasing_history
  - validated_contribution_appears_on_human_profile
  - ranking_can_be_drilled_down_to_underlying_score_components_and_evidence
  - news_item_can_create_provenance_linked_corpus_entities_or_events
  - command_drawer_and_section_subnav_do_not_conflict_with_song_swipe_gesture
  - no_privileged_keys_or_private_reasoning_constitution_are_exposed_client_side
  - complete_seeded_core_loop_works_with_zero_optional_provider_credentials
  - missing_provider_keys_degrade_to_explicit_fixture_or_unavailable_states_without_breaking_navigation
  - adding_a_provider_requires_secret_configuration_and_adapter_activation_not_UI_or_entity_rewrites
